name: keepalive

# Supabase pauses free-tier projects after ~7 days without activity, which
# tears down the project subdomain and makes the app look empty. A cheap
# scheduled read every 2 days counts as activity and prevents that.

on:
  schedule:
    - cron: '13 7 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The publishable key is already public in index.html by design
      # (row-level security is what actually guards the data), so it does
      # not need to live in repository secrets.
      - name: Ping the database
        env:
          SUPABASE_URL: https://yzoyctkyesrzgqijgpfw.supabase.co
          SUPABASE_KEY: sb_publishable_8FFPLUpRMGJq05561Lcj-Q_kGzLg1rJ
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            -H "apikey: ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1")
          echo "HTTP ${code}"
          cat response.json
          echo
          rm -f response.json
          test "${code}" = "200"

      # GitHub disables scheduled workflows on repositories with no commit
      # activity for 60 days, which would silently kill the ping above.
      # Writing a timestamp each run keeps the schedule alive indefinitely.
      - name: Record the ping
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git diff --staged --quiet || git commit -m 'chore: keepalive ping [skip ci]'
          git push
